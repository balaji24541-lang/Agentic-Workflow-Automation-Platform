services:
  postgres:
    image: postgres:16-alpine
    container_name: workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: workflow_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user -d workflow_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
